name: Validate agent readiness proposal

on:
  pull_request:
    paths: ['agent-readiness/**', '.github/workflows/agent-readiness.yml']
  push:
    branches: ['fix/agent-readiness-2026-10-24']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and validate reviewed static documents
        run: sh agent-readiness/build.sh
      - name: Verify HTTP representations and recovery paths
        run: node --test agent-readiness/tests/worker.test.mjs
