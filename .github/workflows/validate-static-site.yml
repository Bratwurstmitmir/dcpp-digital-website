name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Cloudflare preview
        run: sh build.sh

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/assets/css/site.css
          test -s dist/assets/js/site.js
          test -s dist/404.html
          test -s dist/_headers
          test -s dist/_redirects
          test -s dist/robots.txt
          grep -qi 'noindex' dist/index.html
          grep -q 'DCPP' dist/index.html
          grep -q '/about/' dist/index.html
          grep -q '/j/privacy' dist/index.html
          ! grep -q 'https://dcpp.jimdofree.com/about/' dist/index.html
          ! grep -q 'https://dcpp.jimdofree.com/j/privacy' dist/index.html
          grep -q 'html.dcpp-view-digitalpublishing #dcpp-footer' dist/assets/css/site.css
          grep -q '^/about[[:space:]]\+/index.html[[:space:]]\+200' dist/_redirects
          grep -q '^/j/privacy[[:space:]]\+/index.html[[:space:]]\+200' dist/_redirects
          echo "HTML bytes: $(wc -c < dist/index.html)"
          echo "CSS bytes:  $(wc -c < dist/assets/css/site.css)"
          echo "JS bytes:   $(wc -c < dist/assets/js/site.js)"
